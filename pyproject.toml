[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "surslide_ml"
version = "0.1.0"
description = "Numerical computing and AI algorithms built from scratch in Python"
readme = "README.md"
requires-python = ">=3.15.0"
license = "MIT"

[tool.setuptools.packages.find]
where = ["src"]
